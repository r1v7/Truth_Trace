name: Keep the demo API warm

# The free API instance sleeps after 15 minutes idle, and a cold start takes up to a
# minute. A ping every 10 minutes during the day keeps the demo link responsive.
# Delete this workflow when the demo is no longer needed - it is pure waste otherwise.

on:
  schedule:
    - cron: '*/10 6-20 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "VITE_API_URL is not set; nothing to ping."
            exit 0
          fi
          # A sleeping instance can take ~60s to answer, so allow for it.
          curl -sS --max-time 120 --retry 2 --retry-delay 15 "$API_URL/health" || {
            echo "::warning::Demo API did not answer within 120s."
            exit 0
          }
          echo
