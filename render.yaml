# Render blueprint for the public demo.
#
# WARNING: Render's free Postgres is deleted 30 days after it is created. Note the
# date you deploy this. If the demo must outlive that, move the database to a
# provider without an expiry (Neon and Supabase both have free tiers) and replace the
# fromDatabase references below with the four POSTGRES_* values from that provider.
#
# The web service also sleeps after 15 minutes idle on the free plan, so the first
# request can take up to a minute. The interface shows a "waking the server" banner
# for exactly that reason, and .github/workflows/keep-warm.yml pings it on a schedule.

databases:
  - name: truth-trace-db
    databaseName: truthtrace
    user: truthtrace
    plan: free
    region: frankfurt
    # Reachable only from services in this Render account, never from the internet.
    ipAllowList: []

services:
  - type: web
    name: truth-trace-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # Migrations run on boot so a fresh database is usable without a shell.
    dockerCommand: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 8000

      # Wired by Render from the database above: the credentials are never displayed,
      # copied through a dashboard field, or written down anywhere.
      - key: POSTGRES_HOST
        fromDatabase:
          name: truth-trace-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: truth-trace-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: truth-trace-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: truth-trace-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: truth-trace-db
          property: password

      # Generated once by Render and kept; rotating it signs everyone out.
      - key: JWT_SECRET
        generateValue: true

      # The demo is public: this account's password will be known to anyone who is
      # given the link. Never reuse a password you use elsewhere.
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: FIRST_ADMIN_PASSWORD
        sync: false

      - key: SEED_DEMO
        value: "true"

      # The GitHub Pages origin, e.g. https://<user>.github.io
      - key: CORS_ORIGINS
        sync: false

      - key: ANALYZER_BACKEND
        value: lexical

      # Free instances have no persistent disk: uploaded evidence does not survive a
      # restart, and the integrity check will correctly report the file as missing.
      - key: EVIDENCE_DIR
        value: /tmp/evidence
